# Receiver mode like local/prometheus.yml: every sample arrives via remote
# write from the tailer with its original timestamp; the out-of-order
# window must cover the tailer's LOOKBACK (3h) plus an hour.
storage:
  tsdb:
    out_of_order_time_window: 4h
rule_files:
- /etc/alerts/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['127.0.0.1:9093']
