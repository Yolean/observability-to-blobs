# k3s-in-docker variant for hosts without KVM (GitHub-hosted runners). Same
# name and context as the qemu config so test.sh does not care which one
# provisioned the cluster.
provider: docker
name: node-agent
context: node-agent
# GitHub-hosted runners have 2 vCPUs and 7 GB; y-cluster's defaults (4/8192)
# make docker refuse the container there
cpus: "2"
memory: "4096"
# The cluster's Kubernetes release has the minor of test.sh's ENVTEST_K8S:
# apiserver-at runs the cluster's own release, so it uses the API server
# the acceptance test has downloaded already, and kubectl is within its
# version skew. Pinned, because y-cluster's default moves with y-cluster.
k3s:
  version: v1.37.0+k3s1
gateway:
  skip: true
portForwards:
- host: "26443"
  guest: "6443"
- host: "30070"
  guest: "30070"
