apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sagent
---
# Read everything the API server serves: the agent ships what kubectl get
# can show. The wildcard includes Secrets, which the agent reads only with
# secrets_mode scrambled (K8SAGENT.md, "Secrets"; the default skip never
# lists them); an overlay that must not grant even the right replaces this
# rule with an explicit list without secrets, and the agent skips what it
# is not allowed to list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sagent
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8sagent
subjects:
- kind: ServiceAccount
  name: k8sagent
  namespace: observability
