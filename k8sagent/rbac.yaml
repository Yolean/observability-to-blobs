apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sagent
---
# Read everything the API server serves: the agent ships what kubectl get
# can show. Secrets are read too and leave the agent with empty values
# (K8SAGENT.md, "Secrets"); an overlay that must not grant even that
# replaces this rule with an explicit list without secrets, and the agent
# skips what it is not allowed to list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sagent
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8sagent
subjects:
- kind: ServiceAccount
  name: k8sagent
  namespace: observability
