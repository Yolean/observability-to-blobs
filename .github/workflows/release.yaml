name: release

# A tag v* releases the binaries of the tagged commit, all on one release
# of that tag, each with its .sha256 beside it:
#   - tools/y-obs as obs-{os}-{arch} (tools/y-obs/README.md, "Release"),
#     built by tools/y-obs/release.sh on a native runner per platform:
#     duckdb-go links prebuilt static libraries through cgo, so there is
#     no cross compiling; ystack's y-bin entry adds the y- prefix;
#   - the host agent as observability-to-blobs-host-<version>-linux-<arch>.tar.gz
#     (HOST_MODE.md), built by images/fluentbit/host/build.sh on a native
#     runner per arch, the version being the tag without its v.
# Each build is smoke-tested on its runner. One job attaches them all once
# every build has passed, so a release never has some of them.
# workflow_dispatch builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  y-obs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: tools/y-obs/go.mod
        cache-dependency-path: tools/y-obs/go.sum
    - name: Build
      env:
        VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      run: tools/y-obs/release.sh dist "$VERSION"
    - name: Smoke test
      # the engine, the embedded extension and the embedded views, without
      # a bucket: version loads nothing, schema reads an empty raw tier
      run: |
        bin=$(ls dist/obs-* | grep -v sha256)
        "$bin" version
        "$bin" version | grep -q '^httpfs embedded'
        "$bin" schema logs | grep -q '^message'
        "$bin" sql --blobs-dir "$RUNNER_TEMP" --cluster smoke "SELECT count(*) AS n FROM logs"
    - uses: actions/upload-artifact@v7
      with:
        name: obs-${{ matrix.runner }}
        path: dist/
        if-no-files-found: error

  host:
    strategy:
      fail-fast: false
      matrix:
        include:
        - {runner: ubuntu-24.04, arch: amd64}
        - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    # exposes the cache credentials to the plain docker buildx build that
    # build.sh runs
    - uses: crazy-max/ghaction-github-runtime@v4
    - name: Build
      env:
        HOST_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        BUILDX_ARGS: --cache-from type=gha,scope=node-agent-host-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=node-agent-host-${{ matrix.arch }}
      run: |
        export HOST_VERSION=${HOST_VERSION#v}
        images/fluentbit/host/build.sh dist
    - name: Smoke test
      # the runner is the distribution the binary is built for: the
      # checksum holds, and the binary starts with the host's libraries
      run: |
        cd dist
        sha256sum -c ./*.tar.gz.sha256
        sudo apt-get install -y --no-install-recommends libyaml-0-2 libsystemd0
        mkdir root && tar -xzf ./*.tar.gz -C root
        root/bin/fluent-bit --version
        test -f root/etc/host.yaml && test -x root/bin/observability-host-heartbeat
        rm -r root
    - uses: actions/upload-artifact@v7
      with:
        name: host-${{ matrix.arch }}
        path: dist/
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [y-obs, host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -l dist
        gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "observability-to-blobs at $GITHUB_SHA"
        gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
