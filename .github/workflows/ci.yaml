name: ci

# Pushes and pull requests run CI in the upstream repository only. In a
# fork the jobs are skipped unless started by hand (Actions > ci > Run
# workflow), because the itest takes about half an hour of runner time;
# contributors run ./test.sh before they push instead (README.md,
# "Running").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Only calls compactor/build.sh, which is what a developer runs: no Go,
  # contain or cache setup here. Cold on purpose, so the pin check is a
  # reproduction from nothing but the commit and the pinned inputs.
  compactor:
    if: github.repository_owner == 'Yolean' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: compactor/build.sh host-setup
    - run: compactor/build.sh test
    - run: compactor/build.sh check
    - if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Yolean'
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: compactor/build.sh publish

  test:
    if: github.repository_owner == 'Yolean' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # The image builds, the Go caches and the k3s node share the runner's
    # disk, and the kubelet evicts every pod below its free-space
    # thresholds (percentages, so a large disk trips them with gigabytes
    # left). These preinstalled toolchains are never used here.
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - uses: docker/setup-buildx-action@v4

    - uses: actions/setup-go@v7
      with:
        go-version-file: images/fluentbit/plugins/cri_scrape/go.mod
        cache-dependency-path: images/fluentbit/plugins/cri_scrape/go.sum

    # test.sh needs these on PATH; locally they come from the developer's
    # toolchain, here they are pinned downloads. Everything after this step
    # is the same script a developer runs.
    - name: Install y-cluster
      env:
        VERSION: v0.5.0
      run: |
        curl -fsSL -o /usr/local/bin/y-cluster \
          "https://github.com/Yolean/y-cluster/releases/download/${VERSION}/y-cluster_${VERSION}_linux_amd64"
        chmod +x /usr/local/bin/y-cluster
        y-cluster --version

    # the runner's apt shellcheck (0.9.0) reports what current releases no
    # longer do, so test.sh's checks would differ from a developer's run
    - name: Install shellcheck
      env:
        VERSION: v0.11.0
      run: |
        curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.linux.x86_64.tar.xz" \
          | tar -xJ -O "shellcheck-${VERSION}/shellcheck" > /usr/local/bin/shellcheck
        chmod +x /usr/local/bin/shellcheck
        shellcheck --version

    # the engine the compactor embeds, so the itest runs compactor/sql/ on it
    - name: Install duckdb
      run: |
        . compactor/build.env
        curl -fsSL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.gz" \
          | gunzip > /usr/local/bin/duckdb
        chmod +x /usr/local/bin/duckdb
        duckdb --version

    # exposes the cache credentials to the plain `docker buildx build` that
    # test.sh runs. The image job's amd64 scope: the same Dockerfile, target
    # and platform, so the image job that follows finds every layer cached.
    - uses: crazy-max/ghaction-github-runtime@v4

    - run: ./test.sh
      env:
        IMAGE_BUILD_ARGS: --cache-from type=gha,scope=node-agent-amd64 --cache-to type=gha,mode=max,scope=node-agent-amd64
        # the host tarball is built on another base: a cache scope of its own
        HOST_BUILD_ARGS: --cache-from type=gha,scope=node-agent-host-test --cache-to type=gha,mode=max,scope=node-agent-host-test

    - name: Agent logs on failure
      if: failure()
      run: |
        export KUBECONFIG=$PWD/itest/cluster/kubeconfig
        df -h /
        kubectl --context=node-agent get pods -A || true
        kubectl --context=node-agent describe nodes | sed -n '/^Conditions:/,/^Addresses:/p' || true
        kubectl --context=node-agent get events -A --field-selector reason=Evicted || true
        kubectl --context=node-agent logs ds/node-agent --tail=200 || true

  # The host agent's collectors end to end (itest/host-docker/run.sh): the
  # tarball in Ubuntu containers against versitygw, which needs neither the
  # qemu node of test.sh's host phase nor a cluster. Per arch on a runner of
  # that arch, as the release builds the tarball, in the release's cache
  # scope: the same build.
  host-docker:
    if: github.repository_owner == 'Yolean' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - {runner: ubuntu-24.04, arch: amd64}
        - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    # exposes the cache credentials to the plain docker buildx build that
    # build.sh runs
    - uses: crazy-max/ghaction-github-runtime@v4
    - name: Build the tarball
      env:
        BUILDX_ARGS: --cache-from type=gha,scope=node-agent-host-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=node-agent-host-${{ matrix.arch }}
      run: images/fluentbit/host/build.sh target/host
    # the itest reads the bucket with the engine the compactor embeds
    - name: Install duckdb
      run: |
        . compactor/build.env
        curl -fsSL "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-${{ matrix.arch }}.gz" \
          | gunzip > /usr/local/bin/duckdb
        chmod +x /usr/local/bin/duckdb
        duckdb --version
    - run: itest/host-docker/run.sh
      env:
        TARBALL: target/host/observability-to-blobs-host-dev-linux-${{ matrix.arch }}.tar.gz

  # Each image is built per arch on a runner of that arch, because
  # fluent-bit's C build took close to three hours for arm64 under qemu,
  # where amd64 took twenty minutes. Each build pushes by digest only;
  # image-index then tags one index of the two under the commit sha.
  image:
    needs: test
    if: github.event_name == 'push' && github.repository_owner == 'Yolean'
    strategy:
      fail-fast: false
      matrix:
        image:
        - {name: observability-nodeagent, context: images/fluentbit, scope: node-agent}
        - {name: observability-prometheus, context: images/blobs-to-prometheus, scope: blobs-to-prometheus}
        - {name: observability-operator-to-annotations, context: images/operator-to-annotations, scope: operator-to-annotations}
        platform:
        - {arch: amd64, runner: ubuntu-24.04}
        - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.platform.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # GITHUB_TOKEN can only publish under the repository's own owner, and
    # ghcr wants it lowercase
    - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"
    - uses: docker/metadata-action@v6
      id: meta
      with:
        images: ${{ env.IMAGE }}
    - uses: docker/build-push-action@v7
      id: build
      with:
        context: ${{ matrix.image.context }}
        platforms: linux/${{ matrix.platform.arch }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ env.IMAGE }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        # one scope per arch, so that neither export evicts the other's layers
        cache-from: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }}
    - env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
    - uses: actions/upload-artifact@v7
      with:
        name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  image-index:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        name: [observability-nodeagent, observability-prometheus, observability-operator-to-annotations]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digest-${{ matrix.name }}-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Tag the index of both archs
      working-directory: ${{ runner.temp }}/digests
      run: |
        image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}
        refs=()
        for d in *; do refs+=("$image@sha256:$d"); done
        [ "${#refs[@]}" = 2 ] || { ls -l; echo "expected one digest per arch" >&2; exit 1; }
        docker buildx imagetools create -t "$image:$GITHUB_SHA" "${refs[@]}"
        docker buildx imagetools inspect "$image:$GITHUB_SHA"
