# Host agent pipeline (HOST_MODE.md): the same fluent-bit and the same line
# contract (compactor/sql/raw.sql) as the node agent (agent/fluent-bit.yaml),
# run as a systemd service on the host. One blob per UPLOAD_TIMEOUT leaves
# this process: JSON lines, zstd, every line carrying "table" and "ts":
#   logs      journal entries (stream journal) and lines of files (stream
#             file, unit the path), cluster and node on every line
#   metrics   the heartbeat, one line per interval, with "time" as the
#             node agent's scrapes have it
# The node_exporter and the agent's own metrics are cmetrics, which the S3
# output does not ship; they are served on HOST_METRICS_LISTEN:HOST_METRICS_PORT.
# Every line carries "ts", the event time rendered by the S3 output at
# microseconds, as in the node agent; the time of a tailed line is the time
# it was read, the line's own stamps (the audit record's audit(...) stamp)
# are in the message.
#
# Everything the process writes is under /var/lib/observability-host, the
# unit's StateDirectory; it never touches the node agent's /var/lib/node-agent.
#
# Environment (defaults here, so the environment file names only what differs):
#   CLUSTER_NAME NODE_NAME                      required
#   S3_BUCKET S3_ENDPOINT                       required
#   S3_REGION (us-east-1) S3_TLS (on)
#   KEY_ROOT (host1)                            first segment of the object key
#   UPLOAD_TIMEOUT (30s)
#   HOST_EXTRA_FILES ()                         comma-separated paths or globs to tail besides
#                                               the fixed ones below
#   HOST_JOURNAL_DENY (matches nothing)         regex on the unit of a journal row (the value
#                                               "unit" has in the blob); matching rows are left out
#   HOST_NODE_COLLECTORS                        node_exporter collectors, default all of the
#                                               node agent's plus timex, systemd and textfile.
#                                               "textfile" alone on a Kubernetes node, where the
#                                               DaemonSet already exports node_*: only the restart
#                                               flag (and the agent's own metrics) are served
#   HOST_METRICS_LISTEN (127.0.0.1) HOST_METRICS_PORT (2023)
#   HOST_BUFFER_LIMIT (4G)                      each of the two on-disk buffers below
#   HEARTBEAT_COMMAND                           the heartbeat script (the unit sets it)
# plus AWS_SHARED_CREDENTIALS_FILE (the unit points it at the credential it loads).
service:
  flush: 1
  grace: 10
  log_level: info
  # the process serves nothing but the metrics output below
  http_server: off
  storage.path: /var/lib/observability-host/storage
  # a record the input has read survives the crash or the power loss of the
  # host, not only a restart of the service
  storage.sync: full
  storage.max_chunks_up: 128

parsers:
  # the heartbeat row: "time" (nanoseconds) is the event time, and stays in
  # the row as the node agent's scrapes have it
  - name: heartbeat_json
    format: json
    time_key: time
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: on

pipeline:
  inputs:
    # The journal, every unit: a denylist fails toward collecting too much.
    # The processors are the node agent's journal processors (rows are
    # the same), plus the denylist.
    - name: systemd
      alias: journal
      tag: blob
      db: /var/lib/observability-host/journal.db
      db.sync: full
      # the first start; later starts continue from the cursor in db
      read_from_tail: on
      lowercase: on
      strip_underscores: on
      storage.type: filesystem
      processors:
        logs:
          - name: modify
            add:
              - table logs
              - cluster ${CLUSTER_NAME}
              - node ${NODE_NAME}
              - stream journal
            # rename does not overwrite, so the first existing key wins:
            # the unit, else the syslog identifier, else the transport
            # ("kernel" for kernel messages)
            rename:
              - systemd_unit unit
              - syslog_identifier unit
              - transport unit
          - name: content_modifier
            action: convert
            key: priority
            converted_type: int
          # the denylist: a row whose unit matches is left out; a row
          # without a unit, or any row when nothing is configured, stays
          # ((?!) matches nothing)
          - name: grep
            exclude: $unit ${HOST_JOURNAL_DENY:-(?!)}
          # the journal's other fields stay out of the blob
          - name: record_modifier
            allowlist_key:
              - table
              - cluster
              - node
              - stream
              - unit
              - priority
              - message

    # Files. The audit log is followed by inode, never the numbered files
    # (a rotated file is read to its end, then dropped); the position of
    # every file is kept in db.
    - name: tail
      alias: files
      tag: blob
      path: /var/log/audit/audit.log,/var/log/dpkg.log,/var/log/apt/history.log,/var/log/unattended-upgrades/*.log,${HOST_EXTRA_FILES:-}
      # the path is the row's unit
      path_key: unit
      read_from_head: true
      db: /var/lib/observability-host/tail.db
      db.sync: full
      db.locking: true
      refresh_interval: 5
      rotate_wait: 30
      buffer_chunk_size: 256k
      buffer_max_size: 2M
      skip_long_lines: on
      storage.type: filesystem
      processors:
        logs:
          - name: modify
            add:
              - table logs
              - cluster ${CLUSTER_NAME}
              - node ${NODE_NAME}
              - stream file
            rename:
              - log message
          - name: record_modifier
            allowlist_key:
              - table
              - cluster
              - node
              - stream
              - unit
              - message

    # A raw1 metrics row every 60 s: a counter that continues across
    # restarts of the service and starts again at a new boot id. The script
    # also writes the restart flag for the textfile collector below.
    - name: exec
      alias: heartbeat
      tag: blob
      command: ${HEARTBEAT_COMMAND:-/opt/observability-host/bin/observability-host-heartbeat}
      parser: heartbeat_json
      interval_sec: 60
      storage.type: filesystem
      processors:
        logs:
          - name: modify
            add:
              - cluster ${CLUSTER_NAME}
              - node ${NODE_NAME}

    # cmetrics: served below, not shipped
    - name: node_exporter_metrics
      alias: node_exporter
      tag: exp.node
      scrape_interval: 15
      # the node agent's collectors (agent/fluent-bit.yaml: cpufreq, hwmon,
      # thermalzone and nvme left out for the missing sysfs files on VMs),
      # plus timex (clock offset and sync status), systemd (unit states)
      # and textfile (the restart flag the heartbeat script writes)
      metrics: ${HOST_NODE_COLLECTORS:-cpu,meminfo,diskstats,filesystem,uname,stat,time,timex,loadavg,vmstat,netdev,netstat,sockstat,filefd,processes,systemd,textfile}
      # every *.prom file in the state directory
      collector.textfile.path: /var/lib/observability-host

    - name: fluentbit_metrics
      alias: self_metrics
      tag: exp.agent
      scrape_interval: 15

  outputs:
    - name: prometheus_exporter
      match: exp.*
      host: ${HOST_METRICS_LISTEN:-127.0.0.1}
      port: ${HOST_METRICS_PORT:-2023}

    - name: s3
      alias: blob
      match: blob
      bucket: ${S3_BUCKET}
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION:-us-east-1}
      tls: ${S3_TLS:-on}
      tls.ca_file: /etc/ssl/certs/ca-certificates.crt
      # PutObject only: no multipart upload, no listing, no reading
      use_put_object: on
      # buckets with Object Lock require it
      send_content_md5: on
      format: json_lines
      compression: zstd
      # the event time on every line, microseconds, as the node agent renders it
      json_date_key: ts
      json_date_format: iso8601
      upload_timeout: ${UPLOAD_TIMEOUT:-30s}
      total_file_size: 64M
      store_dir: /var/lib/observability-host/s3
      # the node agent's buffering (agent/fluent-bit.yaml): an agent that
      # cannot reach the bucket keeps buffering on disk, retries without a
      # budget (out_s3 caps no_limits to 5 attempts, images/fluentbit/UPSTREAM.md,
      # so an explicit number), and then drops the oldest input chunks. The
      # disk use is at most about twice HOST_BUFFER_LIMIT.
      store_dir_limit_size: ${HOST_BUFFER_LIMIT:-4G}
      storage.total_limit_size: ${HOST_BUFFER_LIMIT:-4G}
      retry_limit: 100000
      # $UUID is drawn again for every upload attempt (HOST_MODE.md, Where it
      # writes), so a retry lands under a new key
      s3_key_format: /${KEY_ROOT:-host1}/${CLUSTER_NAME}/%Y-%m-%d/%H/${NODE_NAME}/%M%S-$UUID.jsonl.zst
