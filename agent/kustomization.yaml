# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base. Overlays set the image tag, CLUSTER_NAME, S3_* env and the
# node-agent-s3 secret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), and can
# replace pipeline-extra.yaml (configMapGenerator behavior: merge) to add
# filters and outputs, e.g. signal forwarding. itest/k8s shows how.
namespace: observability

resources:
- namespace.yaml
- daemonset.yaml

configMapGenerator:
- name: node-agent
  files:
  - fluent-bit.yaml
  - pipeline-extra.yaml
