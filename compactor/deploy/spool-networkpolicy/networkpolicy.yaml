apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blobs-compactor-put
spec:
  podSelector:
    matchLabels:
      app: blobs-compactor
  policyTypes: [Ingress]
  ingress:
  # the put endpoint: the agents' namespace only
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - port: 9000
      protocol: TCP
  # /metrics, from anywhere, as without this policy
  - ports:
    - port: 9090
      protocol: TCP
