# yaml-language-server: $schema=https://github.com/turbokube/contain/raw/refs/heads/main/jsonschema/config.json
#
# OCI image spec for ghcr.io/yolean/blobs-compactor, assembled by
# build.sh (the only build recipe). No platforms here: build.sh always
# sets PLATFORMS, the release platforms or the itest host's.
base: gcr.io/distroless/cc-debian13:nonroot@sha256:54df941ed0d06a1bd95ef5e0ce391fd8d9f94b64782dc9a60062727849ee3f97
layers:
# first: changes on DuckDB bumps only
- localFile:
    pathPerPlatform:
      linux/amd64: ../target/compactor/duckdb/linux/amd64/httpfs.duckdb_extension
      linux/arm64: ../target/compactor/duckdb/linux/arm64/httpfs.duckdb_extension
    containerPath: /usr/local/lib/duckdb/httpfs.duckdb_extension
  layerAttributes:
    uid: 0
    gid: 0
    mode: 0644
- localFile:
    pathPerPlatform:
      linux/amd64: ../target/compactor/app/linux/amd64/blobs-compactor
      linux/arm64: ../target/compactor/app/linux/arm64/blobs-compactor
    containerPath: /usr/local/bin/blobs-compactor
  layerAttributes:
    uid: 65532
    gid: 65534
    mode: 0755
entrypoint:
- /usr/local/bin/blobs-compactor
